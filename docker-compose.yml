services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zenbee
      POSTGRES_PASSWORD: zenbee
      POSTGRES_DB: zenbee
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenbee"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://zenbee:zenbee@db:5432/zenbee
      GENERATION_MODE: ${GENERATION_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-coral}
      RUNWAYML_API_SECRET: ${RUNWAYML_API_SECRET:-}
      PRODUCTION_WORKER: '1'
      MEDIA_ROOT: /media
      AUTH_REQUIRED: '1'
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      OWNER_SETUP_TOKEN: ${OWNER_SETUP_TOKEN:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_SYNC: ${GOOGLE_CALENDAR_SYNC:-0}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      INSTAGRAM_GRAPH_VERSION: ${INSTAGRAM_GRAPH_VERSION:-v27.0}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:-}
      AUTOMATED_PUBLISHING: ${AUTOMATED_PUBLISHING:-0}
    volumes:
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
  media_data:
